name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - feature/DeploDocker 
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React app
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://localhost:5245' }}
          CI: false
        run: npm run build

      - name: Create Cloudflare Pages project (if not exists)
        run: |
          set -e
          echo "Checking if project exists..."
          
          # Check if project exists
          PROJECT_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/oxygen-sensor-frontend" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          
          HTTP_CODE=$(echo "$PROJECT_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$PROJECT_RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" = "404" ] || echo "$RESPONSE_BODY" | grep -q '"success":false'; then
            echo "Project does not exist, creating it..."
            CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"name":"oxygen-sensor-frontend","production_branch":"main"}')
            
            CREATE_HTTP_CODE=$(echo "$CREATE_RESPONSE" | tail -n1)
            CREATE_BODY=$(echo "$CREATE_RESPONSE" | sed '$d')
            
            if [ "$CREATE_HTTP_CODE" = "200" ] || echo "$CREATE_BODY" | grep -q '"success":true'; then
              echo "✅ Project created successfully"
              echo "$CREATE_BODY"
            else
              echo "❌ Failed to create project. Response:"
              echo "$CREATE_BODY"
              echo "HTTP Code: $CREATE_HTTP_CODE"
              echo ""
              echo "⚠️  Please create the project manually in Cloudflare Dashboard:"
              echo "   https://dash.cloudflare.com/ → Workers & Pages → Pages → Create a project"
              exit 1
            fi
          else
            echo "✅ Project already exists"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: oxygen-sensor-frontend
          directory: frontend/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
